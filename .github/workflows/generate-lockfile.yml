name: Generate lockfile

on:
  push:
    branches:
      - astro-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "XUJINKAI"
          git config user.email "XUJINKAI@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependencies"
          git push origin HEAD:astro-migration
